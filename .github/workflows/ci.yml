name: CI

# Typecheck + unit/integration tests. Complements e2e.yml (Playwright). Blocks PRs on regressions.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck (all apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend deps + prisma client
        working-directory: apps/backend
        run: |
          bun install
          bunx prisma generate
      - name: Backend typecheck
        working-directory: apps/backend
        run: bunx tsc --noEmit
      - name: Web typecheck
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
      - name: Admin-panel typecheck
        working-directory: apps/admin-panel
        run: |
          npm ci
          npx tsc --noEmit
      - name: Partner-web typecheck
        working-directory: apps/partner-web
        run: |
          npm ci
          npx tsc --noEmit

  mobile-startup:
    name: Mobile startup regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mobile typecheck
        working-directory: homigo-mobile
        run: npm ci && npm run typecheck
      - name: Startup regression suite
        run: node homigo-mobile/scripts/startup-regression-ci.mjs

  build:
    name: Build (all apps + artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin-panel/package-lock.json
            apps/partner-web/package-lock.json
      - name: Backend build
        working-directory: apps/backend
        run: |
          bun install
          bunx prisma generate
          bun build src/index.ts --outdir dist --target bun
      - name: Web build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Admin-panel build
        working-directory: apps/admin-panel
        run: |
          npm ci
          npm run build
      - name: Partner-web build
        working-directory: apps/partner-web
        run: |
          npm ci
          npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homigo-build-output
          path: |
            apps/backend/dist
            apps/web/.next
            apps/admin-panel/.next
            apps/partner-web/.next
          retention-days: 7

  backend-tests:
    name: Backend unit/integration (isolated test DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homigo_dev
          POSTGRES_DB: homigo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:homigo_dev@localhost:5433/homigo_test?connection_limit=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install + prepare test DB
        working-directory: apps/backend
        run: |
          bun install
          bunx prisma generate
          bun run test:setup
      - name: Run unit/integration tests (includes Phase 16/17/18 regression)
        working-directory: apps/backend
        run: NODE_ENV=test bun test
