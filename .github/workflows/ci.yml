name: CI

# Typecheck + unit/integration tests. Complements e2e.yml (Playwright). Blocks PRs on regressions.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck (all apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend deps + prisma client
        working-directory: apps/backend
        run: |
          bun install
          bunx prisma generate
      - name: Backend typecheck
        working-directory: apps/backend
        run: bunx tsc --noEmit
      - name: Web typecheck
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
      - name: Admin-panel typecheck
        working-directory: apps/admin-panel
        run: |
          npm ci
          npx tsc --noEmit
      - name: Partner-web typecheck
        working-directory: apps/partner-web
        run: |
          npm ci
          npx tsc --noEmit

  mobile-startup:
    name: Mobile startup regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mobile typecheck
        working-directory: homigo-mobile
        run: npm ci && npm run typecheck
      - name: Startup regression suite
        run: node homigo-mobile/scripts/startup-regression-ci.mjs

  build:
    name: Build (all apps + artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin-panel/package-lock.json
            apps/partner-web/package-lock.json
      - name: Backend build
        working-directory: apps/backend
        run: |
          bun install
          bunx prisma generate
          bun build src/index.ts --outdir dist --target bun
      # The three web builds used to sit in the ddl-target-guard job, which never sets up Node and
      # never builds the backend — so its artifact upload could not have found apps/backend/dist.
      # Web's postbuild also enforces the bundle budget (scripts/check-bundle-budget.mjs).
      - name: Web build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Admin-panel build
        working-directory: apps/admin-panel
        run: |
          npm ci
          npm run build
      - name: Partner-web build
        working-directory: apps/partner-web
        run: |
          npm ci
          npm run build
      - name: Release env guard refuses a local backend (self-test)
        run: bun test apps/web/tests/release-env.test.ts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homigo-build-output
          path: |
            apps/backend/dist
            apps/web/.next
            apps/admin-panel/.next
            apps/partner-web/.next
          retention-days: 7

  migration-safety:
    name: Migration safety guard (protected objects are never dropped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the guard diffs new/changed migration SQL against the base ref
      - uses: oven-sh/setup-bun@v2
      - name: Scan migration SQL added or changed on this branch
        working-directory: apps/backend
        env:
          MIGRATION_SAFETY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run scripts/check-migration-safety.ts
      - name: Guard self-test (fixtures must be refused / accepted as designed)
        working-directory: apps/backend
        run: bun test --timeout 45000 ./scripts/__tests__/check-migration-safety.test.ts

  ddl-target-guard:
    name: DDL target guard (no script reaches a database without naming it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: apps/backend
        run: bun install
      - name: Every DDL / hardcoded-url script states its target
        working-directory: apps/backend
        run: bun run scripts/check-ddl-guard-coverage.ts
      - name: Guard behaviour + coverage-checker self-tests
        working-directory: apps/backend
        run: bun test --timeout 45000 ./src/__tests__/ddl-target-guard.test.ts ./scripts/__tests__/check-ddl-guard-coverage.test.ts

  lint:
    name: Lint (all apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Backend lint is now a BLOCKING gate. The P2-12 backlog (102 pre-existing errors, mostly
      # no-unused-vars) that forced report-only mode is cleared: measured 2026-10-03,
      # `bunx eslint src --max-warnings 0` in apps/backend exits 0. `--max-warnings 0` is explicit
      # here so a new warning cannot accumulate into the next backlog.
      #
      # NOTE: the `lint` script itself was broken before this job existed — it passed `--ext ts`,
      # a flag ESLint 9+ removed, so `npm run lint` failed instantly with a usage error and the
      # backend was effectively unlinted. Fixed as part of adding this gate.
      - name: Backend deps + prisma client
        working-directory: apps/backend
        run: |
          bun install
          bunx prisma generate
      - name: Backend lint
        working-directory: apps/backend
        run: bunx eslint src --max-warnings 0

      # The three Next apps lint clean (warnings only) today, so these ARE blocking gates —
      # they protect a currently-green state rather than papering over a backlog.
      - name: Web lint
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
      - name: Admin-panel lint
        working-directory: apps/admin-panel
        run: |
          npm ci
          npm run lint
      - name: Partner-web lint
        working-directory: apps/partner-web
        run: |
          npm ci
          npm run lint

  backend-tests:
    name: Backend unit/integration (isolated test DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homigo_dev
          POSTGRES_DB: homigo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:homigo_dev@localhost:5433/homigo_test?connection_limit=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install + prepare test DB
        working-directory: apps/backend
        run: |
          bun install
          bunx prisma generate
          # --migrate: the empty service database is built from the migration history (as production
          # is). The db push path cannot create migration-only tables, so a fresh push-built DB failed
          # the invariant check.
          bun run test:setup -- --migrate
      - name: Test DB carries the raw-SQL invariants (EXCLUDE / CHECK / trigger)
        working-directory: apps/backend
        run: REQUIRE_TEST_DB=1 NODE_ENV=test bun test --timeout 45000 ./src/__tests__/db-invariants.test.ts
      # Schema / generated-client / live-database agreement. Runs here rather than in `prebuild`
      # because it needs a database, and a build that requires one is a build that gets skipped.
      #
      # It exists because the previous migration verifier probed the client with narrow `select`
      # lists, which ask Postgres only for the columns they name — so a column the client declares
      # and the database lacks was never requested and never errored. It printed 29/29 PASS against
      # a database where `prisma.user.findFirst()` throws P2022. This one derives its expectations
      # from schema.prisma (all 218 models, 2,940 columns) and probes with bare finds.
      - name: Schema / client / database contract (NO_SCHEMA_CLIENT_DRIFT)
        working-directory: apps/backend
        run: bun run scripts/check-schema-client-contract.ts --url "$DATABASE_URL"
      - name: Run unit/integration tests (includes Phase 16/17/18 regression)
        working-directory: apps/backend
        run: NODE_ENV=test bun test --timeout 45000 --max-concurrency 1 --coverage --coverage-reporter=text --coverage-reporter=lcov
      - name: Isolated Prisma mock.module file (must be its own process)
        working-directory: apps/backend
        run: NODE_ENV=test bun test --timeout 45000 ./src/__tests__/data-archival-failure-injection.inject.ts
      - name: Isolated event-bus mock.module file (must be its own process)
        working-directory: apps/backend
        run: NODE_ENV=test bun test --timeout 45000 ./src/events/__tests__/event-bus.inject.ts

      # Coverage is REPORTED, not yet threshold-gated. No numeric floor is asserted here because
      # no measured baseline exists yet — inventing a percentage would either be trivially passable
      # (meaningless) or immediately failing (blocks unrelated work). The lcov artifact makes the
      # real number visible on every run so a defensible floor can be set from evidence. Tracked
      # as P2-12 alongside the backend lint backlog.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          retention-days: 7
          if-no-files-found: warn
