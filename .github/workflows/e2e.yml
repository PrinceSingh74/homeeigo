name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:homigo_dev@localhost:5432/homigo_db
  JWT_SECRET: ci-e2e-jwt-secret-must-be-at-least-32-chars
  JWT_REFRESH_SECRET: ci-e2e-refresh-secret-must-be-32-chars-min
  OTP_SECRET: ci-otp-secret-for-e2e-only
  NODE_ENV: development
  PORT: "3000"
  E2E_API_URL: http://localhost:3000

jobs:
  e2e-customer:
    name: Customer web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homigo_dev
          POSTGRES_DB: homigo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homigo_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend
        working-directory: apps/backend
        run: bun install
      - name: Migrate and seed database
        working-directory: apps/backend
        run: |
          bunx prisma generate
          bunx prisma migrate deploy
          bun run db:seed
      - name: Install web and Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run customer E2E
        working-directory: apps/web
        run: npm run test:e2e
        env:
          CI: true

  e2e-admin:
    name: Admin panel
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homigo_dev
          POSTGRES_DB: homigo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homigo_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin-panel/package-lock.json
      - name: Install backend
        working-directory: apps/backend
        run: bun install
      - name: Migrate and seed database
        working-directory: apps/backend
        run: |
          bunx prisma generate
          bunx prisma migrate deploy
          bun run db:seed
      - name: Install admin panel and Playwright
        working-directory: apps/admin-panel
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run admin E2E
        working-directory: apps/admin-panel
        run: npm run test:e2e
        env:
          CI: true

  e2e-partner:
    name: Partner web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
