          POSTGRES_DB: homigo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homigo_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
