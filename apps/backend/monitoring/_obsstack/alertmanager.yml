global:
  resolve_timeout: 2m

route:
  receiver: homigo-cert-webhook
  group_by: [alertname, severity]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: homigo-cert-webhook
    - match:
        severity: warning
      receiver: homigo-cert-webhook

receivers:
  - name: homigo-cert-webhook
    webhook_configs:
      - url: http://host.docker.internal:45678/webhook
        send_resolved: true

# A `homigo-cert-slack` receiver used to sit here. It was never routed to — every route above
# points at the webhook — and it carried `slack_configs` with no `slack_api_url`, which
# Alertmanager rejects at startup rather than at send time. So the only thing it did was make the
# container exit 1 on boot. Add it back with a real `global.slack_api_url` if Slack delivery is
# wanted; leaving a half-configured receiver in place buys nothing and costs the whole process.
