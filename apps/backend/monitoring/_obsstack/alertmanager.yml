global:
  resolve_timeout: 2m

route:
  receiver: homigo-cert-webhook
  group_by: [alertname, severity]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: homigo-cert-webhook
    - match:
        severity: warning
      receiver: homigo-cert-webhook

receivers:
  - name: homigo-cert-webhook
    webhook_configs:
      - url: http://host.docker.internal:45678/webhook
        send_resolved: true

  - name: homigo-cert-slack
    slack_configs:
      - send_resolved: true
        channel: "#homigo-cert-alerts"
        title: "[CERT] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
