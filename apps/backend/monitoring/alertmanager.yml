global:
  resolve_timeout: 5m
  # Filled at deploy time from a secret (templated config / env-substituted).
  # Leave the placeholder in git; never commit a real webhook/SMTP password.
  slack_api_url: "${SLACK_WEBHOOK_URL}"
  smtp_smarthost: "${SMTP_SMARTHOST}"
  smtp_from: "alerts@homigo.com"
  smtp_auth_username: "${SMTP_USERNAME}"
  smtp_auth_password: "${SMTP_PASSWORD}"

# Escalation chains: critical/escalation page faster (shorter group_wait, more
# frequent repeat); warning/info batch. Slack + email + the internal webhook
# bridge all receive, so a single transport outage never silences an alert.

route:
  receiver: homigo-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # ── Priority escalation matrix (P0→CTO chain, P1→senior eng, P2→eng, P3→batch).
    # repeat_interval drives re-paging cadence; PagerDuty/Opsgenie escalation policies
    # (configured in the receiver) implement the 5m→L2 / 10m→L3 / 15m→CTO ack chain.
    - match:
        priority: P0
      receiver: homigo-escalation
      group_wait: 0s
      repeat_interval: 15m
      continue: false
    - match:
        priority: P1
      receiver: homigo-critical
      group_wait: 10s
      repeat_interval: 30m
      continue: false
    - match:
        priority: P2
      receiver: homigo-warning
      repeat_interval: 2h
      continue: false
    - match:
        priority: P3
      receiver: homigo-info
      repeat_interval: 6h
      continue: false
    - match:
        severity: escalation
      receiver: homigo-escalation
      group_wait: 0s
      repeat_interval: 30m
      continue: false
    - match:
        severity: critical
      receiver: homigo-critical
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: homigo-warning
      repeat_interval: 6h
    - match:
        severity: info
      receiver: homigo-info
      repeat_interval: 12h

receivers:
  - name: homigo-default
    webhook_configs:
      - url: http://backend:3000/api/admin/observability/alerts/evaluate
        send_resolved: true
    slack_configs:
      - channel: "#homigo-alerts"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

  - name: homigo-escalation
    # P0 / escalation. The backend webhook bridge fans out to WhatsApp + SMS (Twilio) +
    # Slack; PagerDuty escalation policy implements 5m→L2, 10m→L3, 15m→CTO ack-based chain.
    webhook_configs:
      - url: http://backend:3000/api/admin/observability/alerts/evaluate
        send_resolved: true
    slack_configs:
      - channel: "#homigo-escalation"
        send_resolved: true
        title: "🚨 P0 ESCALATION: {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
    email_configs:
      - to: "oncall-lead@homigo.com, senior-eng@homigo.com, cto@homigo.com"
        send_resolved: true
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: critical

  - name: homigo-critical
    webhook_configs:
      - url: http://backend:3000/api/admin/observability/alerts/evaluate
    slack_configs:
      - channel: "#homigo-critical"
        send_resolved: true
        title: "🔴 CRITICAL: {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
    email_configs:
      - to: "oncall@homigo.com"
        send_resolved: true

  - name: homigo-warning
    webhook_configs:
      - url: http://backend:3000/api/admin/observability/alerts/evaluate
    slack_configs:
      - channel: "#homigo-warnings"
        send_resolved: true
        title: "🟡 WARNING: {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

  - name: homigo-info
    webhook_configs:
      - url: http://backend:3000/api/admin/observability/alerts/evaluate
    slack_configs:
      - channel: "#homigo-info"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: escalation
    target_match:
      severity: warning
    equal: [alertname]
