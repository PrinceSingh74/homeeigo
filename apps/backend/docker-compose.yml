# Local PostgreSQL for HOMIGO backend
# Start: docker compose up -d
# Stop:  docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: homigo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: homigo_dev
      POSTGRES_DB: homigo_db
    ports:
      - "5432:5432"
    volumes:
      - homigo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homigo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  homigo_pg_data:
