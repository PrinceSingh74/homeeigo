# PgBouncer — transaction pooling tier. Lets N backend pods share a small
# Postgres server-connection budget (2000 client → ~20 server). HA pair.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homigo-pgbouncer
  labels: { app: homigo-pgbouncer }
spec:
  replicas: 2                       # HA pair behind the Service
  selector:
    matchLabels: { app: homigo-pgbouncer }
  template:
    metadata:
      labels: { app: homigo-pgbouncer }
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports: [{ containerPort: 5432 }]
          env:
            - name: DB_HOST
              value: homigo-postgres-primary   # managed PG (e.g. RDS/CloudSQL) endpoint
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: homigo_db
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "5000"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: MIN_POOL_SIZE
              value: "5"
            - name: RESERVE_POOL_SIZE
              value: "5"
          envFrom:
            - secretRef: { name: homigo-pg-credentials }
          resources:
            requests: { cpu: "250m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            tcpSocket: { port: 5432 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: homigo-pgbouncer
spec:
  selector: { app: homigo-pgbouncer }
  ports: [{ port: 5432, targetPort: 5432 }]
