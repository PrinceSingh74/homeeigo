# L7 load balancer (Ingress) — terminates TLS, routes to the backend Service,
# fronts the stateless backend replicas. Rate-limit + connection caps at the edge
# complement the in-app limiter (see enterprise-security-certification.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homigo-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/limit-rps: "200"          # edge burst guard per client IP
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/load-balance: ewma        # least-latency backend selection
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [api.homigo.app]
      secretName: homigo-api-tls
  rules:
    - host: api.homigo.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homigo-backend
                port: { number: 80 }
---
# Pod Disruption Budget — keep capacity during node drains / rolling upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: homigo-backend-pdb
spec:
  minAvailable: 3
  selector:
    matchLabels: { app: homigo-backend }
---
# Queue workers — dispatch matching, payment settlement, notifications, retention
# purge — run OFF the request path (own Deployment, own HPA on queue depth).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homigo-workers
  labels: { app: homigo-workers }
spec:
  replicas: 2
  selector:
    matchLabels: { app: homigo-workers }
  template:
    metadata:
      labels: { app: homigo-workers }
    spec:
      containers:
        - name: worker
          image: ghcr.io/homigo/backend:latest
          command: ["bun", "run", "src/worker.ts"]
          envFrom: [{ secretRef: { name: homigo-secrets } }]
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
