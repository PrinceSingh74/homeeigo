# L7 load balancer (Ingress) — terminates TLS, routes to the backend Service,
# fronts the stateless backend replicas. Rate-limit + connection caps at the edge
# complement the in-app limiter (see enterprise-security-certification.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homigo-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/limit-rps: "200"          # edge burst guard per client IP
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/load-balance: ewma        # least-latency backend selection
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [api.homigo.app]
      secretName: homigo-api-tls
  rules:
    - host: api.homigo.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homigo-backend
                port: { number: 80 }
---
# Pod Disruption Budget — keep capacity during node drains / rolling upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: homigo-backend-pdb
spec:
  minAvailable: 3
  selector:
    matchLabels: { app: homigo-backend }
# Background work (dispatch ticks, settlement sweeps, notifications, retention purge) runs INSIDE the
# API process under leader locks (src/lib/distributed-scheduler.ts — one runner cluster-wide per job,
# anchors on their own connection pool), so it scales with the backend Deployment above. A separate
# "homigo-workers" Deployment that ran `bun run src/worker.ts` was removed 2026-10-01: that entrypoint
# never existed, so the pods could only crash-loop. Splitting workers out is a future design change,
# not a manifest edit.
