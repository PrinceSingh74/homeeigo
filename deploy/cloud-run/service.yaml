# HOMIGO backend — Google Cloud Run service (Knative).
# Deploy:  gcloud run services replace deploy/cloud-run/service.yaml --region=asia-south1
# Image is built from apps/backend/Dockerfile (gcloud builds submit / Artifact Registry).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: homigo-backend
  labels:
    app: homigo
    component: backend
  annotations:
    run.googleapis.com/ingress: all            # front with Cloud Load Balancer + Cloud Armor in prod
spec:
  template:
    metadata:
      annotations:
        # ---- PHASE 1: autoscaling ----
        autoscaling.knative.dev/minScale: "1"   # 1 warm instance → no cold start on first request
        autoscaling.knative.dev/maxScale: "50"  # ceiling for ~10k concurrent users (raise for 100k)
        run.googleapis.com/cpu-throttling: "false"  # keep CPU between requests (timers/maintenance jobs)
        run.googleapis.com/startup-cpu-boost: "true" # faster cold start
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/sessionAffinity: "true"
    spec:
      # ---- PHASE 1: concurrency ----
      containerConcurrency: 80                  # requests per instance before scaling out
      timeoutSeconds: 30
      serviceAccountName: homigo-backend@PROJECT_ID.iam.gserviceaccount.com  # has secretAccessor + cloudsql.client
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/homigo/backend:latest
          ports:
            - name: http1
              containerPort: 8080
          # ---- PHASE 1: CPU + memory limits ----
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: APP_ENV, value: "production" }
            - { name: GCP_PROJECT_ID, value: "PROJECT_ID" }
            # Behind Google's front end. Set TRUST_PROXY_HOPS once the hop count is measured on the real
            # service (boot logs production_config_warning until then) — see src/lib/client-ip.ts.
            - { name: TRUST_PROXY, value: "true" }
            # ---- PHASE 2: secrets from Secret Manager (no plaintext in the manifest/image) ----
            # 2026-10-01: aligned with what the code reads and what assertProductionConfig requires.
            # The previous list omitted REDIS_URL, JWT_REFRESH_SECRET, ENCRYPTION_KEY, OTP_SECRET,
            # RAZORPAY_KEY_ID, RAZORPAY_ACCOUNT_NUMBER and RESEND_API_KEY, so a revision built from it
            # refused to boot; it also injected PII_MASTER_KEY, which no code reads (the PII layer reads
            # MASTER_ENCRYPTION_KEY — mapped from the existing secret below). Secrets not yet created in
            # Secret Manager are an owner action; nothing here invents a value.
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: DATABASE_URL, key: latest } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: REDIS_URL, key: latest } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: JWT_SECRET, key: latest } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: JWT_REFRESH_SECRET, key: latest } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: ENCRYPTION_KEY, key: latest } }
            - name: MASTER_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: PII_MASTER_KEY, key: latest } }
            - name: HASH_HMAC_KEY
              valueFrom: { secretKeyRef: { name: HASH_HMAC_KEY, key: latest } }
            - name: OTP_SECRET
              valueFrom: { secretKeyRef: { name: OTP_SECRET, key: latest } }
            - name: OPS_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: OPS_AUTH_TOKEN, key: latest } }
            - name: RAZORPAY_KEY_ID
              valueFrom: { secretKeyRef: { name: RAZORPAY_KEY_ID, key: latest } }
            - name: RAZORPAY_KEY_SECRET
              valueFrom: { secretKeyRef: { name: RAZORPAY_KEY_SECRET, key: latest } }
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: RAZORPAY_WEBHOOK_SECRET, key: latest } }
            - name: RAZORPAY_ACCOUNT_NUMBER
              valueFrom: { secretKeyRef: { name: RAZORPAY_ACCOUNT_NUMBER, key: latest } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: RESEND_API_KEY, key: latest } }
          # ---- PHASE 1: cold-start / health gating ----
          # /readyz answers 503 until the database does (/health always answered 200, so a revision
          # with an unreachable database took traffic). Liveness is /livez: process only, so a
          # database outage does not restart every healthy instance.
          startupProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10                # up to ~30s for a cold container to become ready
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 3
  traffic:
    - percent: 100
      latestRevision: true
