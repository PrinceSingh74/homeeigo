# HOMIGO backend — STAGING Cloud Run service (isolated from production).
# Deploy (manual, pin SHA image tag — never :latest alone):
#   gcloud builds submit apps/backend --tag REGION-docker.pkg.dev/PROJECT_ID/homigo/backend:COMMIT_SHA
#   sed 's/COMMIT_SHA/<sha>/g; s/PROJECT_ID/<project>/g; s/REGION/<region>/g' deploy/cloud-run/staging-service.yaml | \
#     gcloud run services replace - --region=asia-south1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: homigo-backend-staging
  labels:
    app: homigo
    component: backend
    environment: staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        environment: staging
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 40
      timeoutSeconds: 30
      serviceAccountName: homigo-backend-staging@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/homigo/backend:COMMIT_SHA
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: APP_ENV, value: "staging" }
            - { name: SENTRY_ENVIRONMENT, value: "staging" }
            - { name: SECRETS_SOURCE, value: "gsm" }
            - { name: GCP_PROJECT_ID, value: "PROJECT_ID" }
            - { name: EVENTS_OUTBOX_ENABLED, value: "false" }
            - { name: EVENTS_CONSUMERS_ENABLED, value: "false" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: STAGING_DATABASE_URL, key: latest } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: STAGING_REDIS_URL, key: latest } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: STAGING_JWT_SECRET, key: latest } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: STAGING_JWT_REFRESH_SECRET, key: latest } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: STAGING_ENCRYPTION_KEY, key: latest } }
            - name: RAZORPAY_KEY_ID
              valueFrom: { secretKeyRef: { name: STAGING_RAZORPAY_KEY_ID, key: latest } }
            - name: RAZORPAY_KEY_SECRET
              valueFrom: { secretKeyRef: { name: STAGING_RAZORPAY_KEY_SECRET, key: latest } }
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: STAGING_RAZORPAY_WEBHOOK_SECRET, key: latest } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: STAGING_RESEND_API_KEY, key: latest } }
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 3
  traffic:
    - percent: 100
      latestRevision: true
