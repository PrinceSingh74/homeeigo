# STAGING ONLY — no production receivers. Secrets injected at deploy time.
global:
  resolve_timeout: 5m
  slack_api_url: "${STAGING_SLACK_WEBHOOK_URL}"

route:
  receiver: homigo-staging-default
  group_by: [alertname, severity, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: homigo-staging-critical
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: homigo-staging-warning
      repeat_interval: 6h

receivers:
  - name: homigo-staging-default
    slack_configs:
      - channel: "#homigo-staging-alerts"
        send_resolved: true
        title: "[STAGING] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

  - name: homigo-staging-critical
    slack_configs:
      - channel: "#homigo-staging-alerts"
        send_resolved: true
        title: "[STAGING CRITICAL] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

  - name: homigo-staging-warning
    slack_configs:
      - channel: "#homigo-staging-alerts"
        send_resolved: true
        title: "[STAGING WARNING] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

inhibit_rules: []
