services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: homigo-prom-staging
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules/homigo-alerts.yml:/etc/prometheus/rules/homigo-alerts.yml:ro
      - ./rules/homigo-enterprise-alerts.yml:/etc/prometheus/rules/homigo-enterprise-alerts.yml:ro
      - ./secrets/ops-token:/etc/prometheus/secrets/ops-token:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - obs

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: homigo-am-staging
    restart: unless-stopped
    environment:
      STAGING_SLACK_WEBHOOK_URL: ${STAGING_SLACK_WEBHOOK_URL:-http://127.0.0.1:1/disabled}
    volumes:
      - ./alertmanager-staging.yml:/etc/alertmanager/alertmanager.yml.template:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|\$${STAGING_SLACK_WEBHOOK_URL}|$$STAGING_SLACK_WEBHOOK_URL|g" /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "9093:9093"
    networks:
      - obs

  grafana:
    image: grafana/grafana:11.3.0
    container_name: homigo-grafana-staging
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards-provider:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - obs

networks:
  obs:
    driver: bridge

volumes:
  prom-data:
  grafana-data:
